name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # FFmpeg download URL (gyan.dev — stable, free, no auth)
  FFMPEG_URL: "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
  FFMPEG_ARCHIVE: "ffmpeg-release-essentials.zip"
  # The zip extracts to a folder like "ffmpeg-7.1-essentials_build"
  # We use a glob to find ffmpeg.exe inside it
  FFMPEG_EXE_GLOB: "ffmpeg-*/bin/ffmpeg.exe"

jobs:
  build-windows:
    name: Build Windows (NSIS Installer + Portable ZIP)
    runs-on: windows-latest
    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchains ────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Cache Rust crates (downloaded dependencies) ──────────
      - name: Cache Rust crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # ── Download FFmpeg (external, NOT from GitHub) ───────────
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/ffmpeg.exe
          key: ffmpeg-essentials-win64-v1

      - name: Download FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Downloading FFmpeg from gyan.dev..."
          Invoke-WebRequest -Uri "${{ env.FFMPEG_URL }}" -OutFile "${{ env.FFMPEG_ARCHIVE }}" -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path "${{ env.FFMPEG_ARCHIVE }}" -DestinationPath "ffmpeg-extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in archive" }
          Write-Host "Found ffmpeg.exe at: $($ffmpegExe.FullName)"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/resources/ffmpeg.exe"
          Write-Host "FFmpeg placed at src-tauri/resources/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg-extracted", "${{ env.FFMPEG_ARCHIVE }}"

      - name: Verify FFmpeg
        shell: pwsh
        run: |
          $f = "src-tauri/resources/ffmpeg.exe"
          if (-not (Test-Path $f)) { throw "ffmpeg.exe missing from resources!" }
          $size = (Get-Item $f).Length / 1MB
          Write-Host "ffmpeg.exe present — $([math]::Round($size, 1)) MB"

      # ── Extract app version ───────────────────────────────────
      - name: Extract app version
        id: extract-version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -eq "../package.json") {
            $version = (Get-Content package.json | ConvertFrom-Json).version
          }
          Write-Host "Extracted version: $version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      # ── Build Tauri app ───────────────────────────────────────
      - name: Build Tauri (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          args: "--bundles nsis"

      # ── Collect NSIS installer ────────────────────────────────
      - name: Collect NSIS installer
        id: collect-nsis
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found!" }
          Write-Host "NSIS installer: $($installer.FullName) — $([math]::Round($installer.Length / 1MB, 1)) MB"
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      # ── Build Portable ZIP ────────────────────────────────────
      - name: Prepare portable directory
        shell: pwsh
        run: |
          $portableDir = "portable/EasySpecy"
          $resourcesDir = "$portableDir/resources"
          New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null

          # Copy the built binary
          $exe = "src-tauri/target/release/easyspecy.exe"
          if (-not (Test-Path $exe)) { throw "easyspecy.exe not found at $exe" }
          Copy-Item $exe "$portableDir/EasySpecy.exe"

          # Copy FFmpeg into resources/ (consistent with NSIS installer structure)
          Copy-Item "src-tauri/resources/ffmpeg.exe" "$resourcesDir/ffmpeg.exe"

          # Copy any additional resources the app needs (cursors, etc.)
          if (Test-Path "src-tauri/resources/cursors") {
            Copy-Item -Recurse "src-tauri/resources/cursors" "$resourcesDir/cursors"
          }

          Write-Host "Portable directory contents:"
          Get-ChildItem -Recurse $portableDir | ForEach-Object { Write-Host "  $_" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "portable/EasySpecy" -DestinationPath "EasySpecy-Portable.zip" -Force
          $zip = Get-Item "EasySpecy-Portable.zip"
          Write-Host "Portable ZIP: $([math]::Round($zip.Length / 1MB, 1)) MB"

      - name: Sign NSIS installer
        id: sign-nsis
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Write-Host "Signing: $($installer.FullName)"
          node node_modules/@tauri-apps/cli/tauri.js signer sign $installer.FullName
          $sigFile = "$($installer.FullName).sig"
          if (Test-Path $sigFile) {
            $sig = Get-Content $sigFile -Raw
            # Trim whitespace/newlines for clean output
            $sig = $sig.Trim()
            echo "nsis_signature=$sig" >> $env:GITHUB_OUTPUT
            Write-Host "NSIS signed successfully"
          } else {
            throw "NSIS signature file not found after signing!"
          }

      - name: Sign portable ZIP
        id: sign-portable
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          Write-Host "Signing: EasySpecy-Portable.zip"
          node node_modules/@tauri-apps/cli/tauri.js signer sign EasySpecy-Portable.zip
          if (Test-Path "EasySpecy-Portable.zip.sig") {
            $sig = Get-Content "EasySpecy-Portable.zip.sig" -Raw
            $sig = $sig.Trim()
            echo "portable_signature=$sig" >> $env:GITHUB_OUTPUT
            Write-Host "Portable signed successfully"
          } else {
            throw "Portable signature file not found after signing!"
          }

      # ── Extract changelog for this release ───────────────────
      - name: Extract changelog body
        id: changelog
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          # Extract the section for the current version
          $version = "${{ env.APP_VERSION }}"
          $pattern = "(?ms)## \[$version\].*?(?=\n## \[|\z)"
          if ($changelog -match $pattern) {
            $body = $Matches[0].Trim()
          } else {
            $body = "See CHANGELOG.md for details."
          }
          # Write to a file to avoid multiline env var issues
          $body | Out-File -FilePath "release_body.md" -Encoding utf8
          Write-Host "Release body extracted for v$version"

      # ── Upload Release Assets ─────────────────────────────────
      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: EasySpecy v${{ env.APP_VERSION }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.collect-nsis.outputs.installer_path }}
            EasySpecy-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Generate and commit latest.json ─────────────────────
      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}"
          $pubDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $notes = "EasySpecy v$version"
          # Read changelog section for this version
          $changelog = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $pattern = "(?ms)## \[$version\].*?(?=\n## \[|\z)"
          if ($changelog -match $pattern) {
            $notes = $Matches[0].Trim()
          }
          $nsisSig = @"
          ${{ steps.sign-nsis.outputs.nsis_signature }}
          "@.Trim()
          $portableSig = @"
          ${{ steps.sign-portable.outputs.portable_signature }}
          "@.Trim()
          $nsisUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/$((Get-Item '${{ steps.collect-nsis.outputs.installer_path }}').Name)"
          $latestJson = @{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $nsisSig
                url = $nsisUrl
              }
            }
            portable = @{
              url = "https://github.com/${{ github.repository }}/releases/download/v$version/EasySpecy-Portable.zip"
              signature = $portableSig
            }
          } | ConvertTo-Json -Depth 5
          $latestJson | Out-File -FilePath "latest.json" -Encoding utf8 -NoNewline
          Write-Host "Generated latest.json for v$version"
          Get-Content latest.json

      - name: Commit latest.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch latest master to avoid non-fast-forward errors
          git fetch origin master
          git checkout -B master origin/master
          
          git add latest.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update latest.json for v${{ env.APP_VERSION }}"
            git push origin master
            Write-Host "latest.json committed"
          } else {
            Write-Host "latest.json unchanged"
          }

      # ── Summary ───────────────────────────────────────────────
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════"
          Write-Host "  EasySpecy Release Build Complete"
          Write-Host "═══════════════════════════════════════"
          Write-Host "  Tag: ${{ github.ref_name }}"
          $nsis = "src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsis) {
            Get-ChildItem $nsis -Filter "*.exe" | ForEach-Object {
              Write-Host "  NSIS:     $($_.Name) — $([math]::Round($_.Length / 1MB, 1)) MB"
            }
          }
          if (Test-Path "EasySpecy-Portable.zip") {
            $z = Get-Item "EasySpecy-Portable.zip"
            Write-Host "  Portable: EasySpecy-Portable.zip — $([math]::Round($z.Length / 1MB, 1)) MB"
          }
          Write-Host "═══════════════════════════════════════"
