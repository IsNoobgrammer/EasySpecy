[package]
name = "easyspecy"
version = "1.2.0"
description = "Free screen recorder for Windows with cursor effects, webcam and keyboard overlays"
authors = ["Shaurya"]
edition = "2021"
license = "MIT"

[lib]
name = "easyspecy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "easyspecy"
path = "src/main.rs"



[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.15"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
nnnoiseless = "0.5.2"


[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
windows-core = "0.62"
# Same versions Tauri's WebView2 bindings use (already in the lockfile) — for SetMemoryUsageTargetLevel
webview2-com = "0.38"
windows-core-wv2 = { package = "windows-core", version = "0.61" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"

# Local test builds: `npm run build:fast` (~seconds per rebuild instead of ~80 s).
# Incremental + many codegen units for our crate; dependencies stay fully optimised, so the
# app behaves like release. CI release builds use [profile.release] untouched.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 2

[profile.fast.package."*"]
opt-level = 3
codegen-units = 16
