[package]
name = "easyspecy"
version = "0.1.0"
description = "Free, cross-platform screen recorder with auto-zoom and cursor effects"
authors = ["Shaurya"]
edition = "2021"
license = "MIT"

[lib]
name = "easyspecy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "easyspecy"
path = "src/main.rs"

[[bin]]
name = "sync_test"
path = "src/bin/sync_test.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
miniz_oxide = "0.8"
base64 = "0.22"
crc32fast = "1.4"
rayon = "1.10"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nnnoiseless = "0.5"
flume = "0.11"
crossbeam-utils = "0.8"
dasp = "0.11"
rubato = "0.16"
sysinfo = "0.39"
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
cosmic-text = "0.12"
muda = "0.19"
tray-icon = "0.24"
rav1e = "0.8"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Input"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"
