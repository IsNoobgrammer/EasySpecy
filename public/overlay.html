<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasySpecy Effects Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    
    #keyboard-overlay {
      position: absolute;
      display: none; /* hidden until enabled */
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px;
      pointer-events: none;
      z-index: 99999;
      transition: opacity 0.15s ease-out;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
    }

    #keyboard-overlay.kb-hidden {
      opacity: 0 !important;
    }

    .kb-bubble {
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
      text-align: center;
      min-width: 32px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      /* No CSS animation — prevents jitter and flashing */
    }

    /* ── Webcam PiP ── */
    #webcam-pip {
      position: absolute;
      overflow: hidden;
      pointer-events: none;
      z-index: 99998; /* just below keyboard overlay */
      display: none;  /* hidden until config loaded */
    }
    #webcam-pip video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="webcam-pip"><video id="webcam-video" autoplay muted playsinline></video></div>
  <div id="keyboard-overlay"></div>
  <script>
    /**
     * EasySpecy Effects Overlay v3 — Event-driven + Spline Interpolation
     *
     * KEY FIXES over v2:
     * 1. Receives cursor position via Tauri events (not DOM mousemove which doesn't work on click-through windows)
     * 2. Uses Catmull-Rom spline interpolation between samples for buttery smooth trails
     * 3. Renders at display refresh rate (requestAnimationFrame) independent of input rate
     * 4. Immediate point injection — no frame delay between event receipt and render
     */

    // ── Color Helpers ──
    function hexToRgb(hex) {
      const h = hex.replace("#", "");
      return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
    }
    function rgba(hex, a) {
      const [r, g, b] = hexToRgb(hex);
      return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`;
    }
    function hsl(h, s, l, a) { return `hsla(${h % 360},${s}%,${l}%,${Math.max(0, Math.min(1, a))})`; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    // ── Catmull-Rom Spline Interpolation ──
    // Given 4 control points and t in [0,1], returns interpolated position
    function catmullRom(p0, p1, p2, p3, t) {
      const t2 = t * t, t3 = t2 * t;
      return 0.5 * (
        (2 * p1) +
        (-p0 + p2) * t +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * t3
      );
    }

    function drawSmoothPath(ctx, pts) {
      if (pts.length < 2) return;
      ctx.moveTo(pts[0].x, pts[0].y);
      if (pts.length === 2) { ctx.lineTo(pts[1].x, pts[1].y); return; }
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i];
        const p2 = pts[Math.min(pts.length - 1, i + 1)], p3 = pts[Math.min(pts.length - 1, i + 2)];
        ctx.bezierCurveTo(p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
          p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6, p2.x, p2.y);
      }
    }

    // ── Spline-Interpolated Trail Renderer ──
    class TrailRenderer {
      constructor() {
        this.rawPoints = [];     // Raw input samples from Rust (timestamped)
        this.points = [];        // Interpolated render points
        this.style = "glow";
        this.color = "#00e88a";
        this.time = 0;
        this.lastX = 0;
        this.lastY = 0;
        this.velocity = 0;
        this.maxRaw = 20;       // Keep last N raw samples for spline
        this.maxPoints = 80;    // Max render points
      }

      // Called when a new cursor position arrives from Rust
      addRawPoint(x, y) {
        const now = performance.now();
        const dx = x - this.lastX, dy = y - this.lastY;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.5) return; // Deduplicate sub-pixel jitter

        this.velocity = Math.min(dist, 40);
        this.lastX = x;
        this.lastY = y;
        this.rawPoints.push({ x, y, t: now });
        if (this.rawPoints.length > this.maxRaw) this.rawPoints.shift();

        // Interpolate between the last few raw points to generate smooth render points
        this._interpolate();
      }

      _interpolate() {
        const raw = this.rawPoints;
        if (raw.length < 2) {
          // Just add the point directly
          if (raw.length === 1) {
            this.points.push({ x: raw[0].x, y: raw[0].y, age: 0, vx: 0, vy: 0 });
          }
          return;
        }

        // Generate interpolated points between the last two raw samples
        const n = raw.length;
        const p0 = raw[Math.max(0, n - 3)];
        const p1 = raw[Math.max(0, n - 2)];
        const p2 = raw[n - 1];
        const p3 = raw[Math.min(n - 1, n)]; // clamp to last

        // Number of interpolation steps based on distance (more distance = more steps)
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const steps = Math.max(2, Math.min(6, Math.ceil(dist / 4)));

        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const ix = catmullRom(p0.x, p1.x, p2.x, p3.x, t);
          const iy = catmullRom(p0.y, p1.y, p2.y, p3.y, t);
          const vx = (p2.x - p1.x) * 0.08;
          const vy = (p2.y - p1.y) * 0.08;
          this.points.push({ x: ix, y: iy, age: 0, vx, vy });
        }

        // Trim to max
        while (this.points.length > this.maxPoints) this.points.shift();
      }

      update() {
        this.time++;
        this.velocity *= 0.92;
        this.points = this.points.filter(p => {
          p.age++;
          p.x += p.vx * 0.2;
          p.y += p.vy * 0.2;
          p.vx *= 0.94;
          p.vy *= 0.94;
          return p.age < 50;
        });
      }

      draw(ctx) {
        if (this.style === "none" || this.points.length === 0) return;
        ({ glow: () => this.drawGlow(ctx), particles: () => this.drawParticles(ctx),
           ribbon: () => this.drawRibbon(ctx), dots: () => this.drawDots(ctx),
           aurora: () => this.drawAurora(ctx) })[this.style]?.();
      }

      drawGlow(ctx) {
        const pts = this.points; if (pts.length < 2) return; ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
        const velFactor = Math.min(1, this.velocity / 15);
        // Multi-pass vector glow (no heavy CSS filter - 10x faster rendering)
        const glowLayers = [
          { width: 32, alpha: 0.015 },
          { width: 24, alpha: 0.03 },
          { width: 16, alpha: 0.06 },
          { width: 10, alpha: 0.15 },
          { width: 5, alpha: 0.4 },
          { width: 2, alpha: 0.9 }
        ];
        for (const { width, alpha } of glowLayers) {
          ctx.beginPath(); drawSmoothPath(ctx, pts); ctx.strokeStyle = rgba(this.color, alpha); ctx.lineWidth = width * (0.6 + velFactor * 0.4); ctx.stroke();
        }
        const head = pts[pts.length - 1], hl = Math.max(0, 1 - head.age / 25), pulse = 1 + Math.sin(this.time * 0.12) * 0.15, hr = (14 + velFactor * 8) * pulse;
        const g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr);
        g.addColorStop(0, rgba(this.color, 0.7 * hl)); g.addColorStop(0.3, rgba(this.color, 0.3 * hl)); g.addColorStop(0.6, rgba(this.color, 0.08 * hl)); g.addColorStop(1, rgba(this.color, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(head.x, head.y, hr, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x, head.y, 2 * hl, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${0.9 * hl})`; ctx.fill();
        ctx.restore();
      }

      drawParticles(ctx) {
        const pts = this.points; ctx.save();
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i], life = 1 - p.age / 50; if (life <= 0) continue;
          const size = (2 + life * 4) * (0.5 + this.velocity / 20);
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
          glow.addColorStop(0, rgba(this.color, life * 0.9)); glow.addColorStop(0.5, rgba(this.color, life * 0.3)); glow.addColorStop(1, rgba(this.color, 0));
          ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.6, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${life * 0.7})`; ctx.fill();
          for (let s = 0; s < Math.floor(life * 5); s++) {
            const a = this.time * 0.08 + i * 1.3 + s * 2.4, d = 3 + Math.sin(this.time * 0.06 + s) * 6 * life;
            ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, 0.8 + life * 1.2, 0, Math.PI * 2);
            ctx.fillStyle = rgba(this.color, life * 0.5 * (0.5 + Math.sin(a * 3) * 0.5)); ctx.fill();
          }
        }
        if (pts.length > 0) {
          const head = pts[pts.length - 1];
          for (let i = 0; i < 12; i++) {
            const a = this.time * 0.025 + i * 0.524, d = 8 + Math.sin(this.time * 0.04 + i * 1.7) * 12;
            ctx.beginPath(); ctx.arc(head.x + Math.cos(a) * d, head.y + Math.sin(a) * d, 1 + Math.sin(this.time * 0.07 + i * 1.5) * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = rgba(this.color, 0.3 + Math.sin(this.time * 0.12 + i * 2.3) * 0.25); ctx.fill();
          }
        }
        ctx.restore();
      }

      drawRibbon(ctx) {
        const pts = this.points; if (pts.length < 3) return; ctx.save();
        // Multi-pass vector ribbon (no heavy CSS filter - 10x faster rendering)
        const ribbonLayers = [
          { width: 22, alpha: 0.02 },
          { width: 14, alpha: 0.06 },
          { width: 8, alpha: 0.15 },
          { width: 4, alpha: 0.35 },
          { width: 1.5, alpha: 0.7 }
        ];
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (const { width, alpha } of ribbonLayers) {
          ctx.beginPath(); drawSmoothPath(ctx, pts);
          ctx.strokeStyle = rgba(this.color, alpha); ctx.lineWidth = width; ctx.stroke();
        }
        ctx.beginPath(); drawSmoothPath(ctx, pts); ctx.strokeStyle = `rgba(255,255,255,${0.15 + Math.sin(this.time * 0.08) * 0.1})`; ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]); ctx.lineDashOffset = -this.time * 2; ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
      }

      drawDots(ctx) {
        const pts = this.points; ctx.save();
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i], life = 1 - p.age / 50; if (life <= 0) continue;
          const size = (2 + life * 5) * easeOutCubic(life), alpha = life * 0.85;
          ctx.beginPath(); ctx.arc(p.x, p.y, size + 3, 0, Math.PI * 2); ctx.fillStyle = rgba(this.color, alpha * 0.1); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.fillStyle = rgba(this.color, alpha); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.35, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${alpha * 0.6})`; ctx.fill();
          if (i < pts.length - 1) { const n = pts[i + 1], nl = 1 - n.age / 50; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.strokeStyle = rgba(this.color, Math.min(alpha, nl) * 0.15); ctx.lineWidth = 1; ctx.stroke(); }
        }
        ctx.restore();
      }

      drawAurora(ctx) {
        const pts = this.points; if (pts.length < 4) return; ctx.save();
        const bh = (this.time * 1.5) % 360;
        for (let layer = 0; layer < 4; layer++) {
          const off = layer * 35, w = 22 - layer * 4, la = 0.04 + layer * 0.03, wa = 8 + layer * 3, wf = 0.15 + layer * 0.05;
          ctx.beginPath();
          for (let i = 0; i < pts.length; i++) { const p = pts[i], lr = 1 - p.age / 50, wave = Math.sin(this.time * 0.025 + i * wf + layer * 1.2) * wa * lr; if (i === 0) ctx.moveTo(p.x + wave, p.y - w / 2 + Math.sin(this.time * 0.018 + i * 0.12 + layer) * 4); else ctx.lineTo(p.x + wave, p.y - w / 2 + Math.sin(this.time * 0.018 + i * 0.12 + layer) * 4); }
          for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i], lr = 1 - p.age / 50, wave = Math.sin(this.time * 0.025 + i * wf + layer * 1.2 + 2) * wa * lr; ctx.lineTo(p.x + wave, p.y + w / 2 + Math.sin(this.time * 0.018 + i * 0.12 + layer + 2) * 4); }
          ctx.closePath();
          const hue = (bh + off) % 360, grd = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
          grd.addColorStop(0, hsl(hue, 80, 55, 0)); grd.addColorStop(0.2, hsl(hue + 20, 85, 60, la)); grd.addColorStop(0.5, hsl(hue + 50, 80, 55, la * 1.2)); grd.addColorStop(0.8, hsl(hue + 80, 85, 60, la)); grd.addColorStop(1, hsl(hue + 100, 80, 55, 0));
          ctx.fillStyle = grd; ctx.fill();
        }
        ctx.beginPath(); drawSmoothPath(ctx, pts); ctx.strokeStyle = rgba(this.color, 0.35); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.stroke();
        ctx.beginPath(); drawSmoothPath(ctx, pts); ctx.strokeStyle = `rgba(255,255,255,${0.1 + Math.sin(this.time * 0.06) * 0.08})`; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
      }
    }

    // ── Click Effect Renderer ──
    class ClickEffectRenderer {
      constructor() { this.clicks = []; this.style = "ripple"; this.color = "#00e88a"; this.confetti = []; }
      addClick(x, y) { this.clicks.push({ x, y, age: 0, color: this.color }); if (this.style === "confetti") this.spawnConfetti(x, y); }
      spawnConfetti(x, y) {
        const colors = [this.color, "#ff4455", "#4488ff", "#ffcc22", "#ff44cc", "#44ffcc", "#ff8844"];
        const shapes = ["rect", "circle", "triangle"];
        for (let i = 0; i < 30; i++) {
          const a = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.4, sp = 2.5 + Math.random() * 5;
          this.confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5, age: 0, maxAge: 45 + Math.random() * 25, color: colors[Math.floor(Math.random() * colors.length)], size: 2 + Math.random() * 4, rot: Math.random() * Math.PI * 2, rs: (Math.random() - 0.5) * 0.25, shape: shapes[Math.floor(Math.random() * shapes.length)] });
        }
      }
      update() {
        this.clicks = this.clicks.filter(c => { c.age++; return c.age < 65; });
        this.confetti = this.confetti.filter(p => { p.age++; p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.vx *= 0.985; p.rot += p.rs; return p.age < p.maxAge; });
      }
      draw(ctx) {
        if (this.style === "none") return;
        for (const c of this.clicks) ({ ripple: () => this.drawRipple(ctx, c), spotlight: () => this.drawSpotlight(ctx, c), ring: () => this.drawRing(ctx, c), pulse: () => this.drawPulse(ctx, c) })[this.style]?.();
        if (this.style === "confetti") this.drawConfetti(ctx);
      }
      drawRipple(ctx, c) {
        const p = c.age / 65; if (p >= 1) return;
        for (let i = 0; i < 3; i++) { const rt = easeInOutQuad(Math.max(0, Math.min(1, (p - i * 0.12) / 0.65))); if (rt <= 0 || rt >= 1) continue; ctx.beginPath(); ctx.arc(c.x, c.y, rt * 45, 0, Math.PI * 2); ctx.strokeStyle = rgba(c.color, (1 - rt) * 0.7); ctx.lineWidth = 3 - rt * 2.5; ctx.stroke(); }
        if (p < 0.2) { const ft = 1 - p / 0.2, fs = 6 + (1 - ft) * 4; const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, fs); g.addColorStop(0, `rgba(255,255,255,${ft * 0.9})`); g.addColorStop(0.3, rgba(c.color, ft * 0.7)); g.addColorStop(1, rgba(c.color, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, fs, 0, Math.PI * 2); ctx.fill(); }
      }
      drawSpotlight(ctx, c) {
        const p = c.age / 65; if (p >= 1) return;
        const r = 6 + easeOutCubic(p) * 40, a = (1 - p) * 0.55;
        const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r);
        g.addColorStop(0, `rgba(255,255,255,${a * 0.5})`); g.addColorStop(0.15, rgba(c.color, a * 0.7)); g.addColorStop(0.4, rgba(c.color, a * 0.3)); g.addColorStop(0.75, rgba(c.color, a * 0.06)); g.addColorStop(1, rgba(c.color, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill();
        if (p < 0.6) { const ra = (1 - p / 0.6) * 0.45, rl = 4 + p * 25; ctx.strokeStyle = rgba(c.color, ra); ctx.lineWidth = 1.5; for (let i = 0; i < 6; i++) { const an = (i * Math.PI) / 3 + p * 0.8; ctx.beginPath(); ctx.moveTo(c.x + Math.cos(an) * 2, c.y + Math.sin(an) * 2); ctx.lineTo(c.x + Math.cos(an) * rl, c.y + Math.sin(an) * rl); ctx.stroke(); } }
      }
      drawRing(ctx, c) {
        const p = c.age / 65; if (p >= 1) return;
        ctx.beginPath(); ctx.arc(c.x, c.y, 4 + easeOutCubic(p) * 35, 0, Math.PI * 2); ctx.strokeStyle = rgba(c.color, (1 - p) * 0.75); ctx.lineWidth = 3.5 - p * 2.5; ctx.stroke();
        if (p < 0.45) { const it = p / 0.45; ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0, 18 * (1 - easeOutCubic(it))), 0, Math.PI * 2); ctx.strokeStyle = rgba(c.color, (1 - it) * 0.6); ctx.lineWidth = 2; ctx.stroke(); }
        const ds = 3.5 * (1 - p); if (ds > 0.3) { ctx.beginPath(); ctx.arc(c.x, c.y, ds, 0, Math.PI * 2); ctx.fillStyle = rgba(c.color, (1 - p) * 0.9); ctx.fill(); ctx.beginPath(); ctx.arc(c.x, c.y, ds * 0.4, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${(1 - p) * 0.8})`; ctx.fill(); }
      }
      drawPulse(ctx, c) {
        const p = c.age / 65; if (p >= 1) return;
        for (let i = 0; i < 5; i++) { const ph = (p * 1.5 + i * 0.18) % 1; ctx.beginPath(); ctx.arc(c.x, c.y, ph * 30, 0, Math.PI * 2); ctx.strokeStyle = rgba(c.color, (1 - ph) * 0.55); ctx.lineWidth = 2.5 - ph * 2; ctx.stroke(); }
        const b = Math.sin(p * Math.PI * 8) * 0.3 + 0.7, gs = 5 + b * 3;
        const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, gs); g.addColorStop(0, rgba(c.color, b * (1 - p) * 0.8)); g.addColorStop(1, rgba(c.color, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, gs, 0, Math.PI * 2); ctx.fill();
      }
      drawConfetti(ctx) {
        for (const p of this.confetti) { const lr = 1 - p.age / p.maxAge; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = lr * 0.9; ctx.fillStyle = p.color;
          if (p.shape === "rect") ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          else if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
          else { ctx.beginPath(); ctx.moveTo(0, -p.size / 2); ctx.lineTo(p.size / 2, p.size / 2); ctx.lineTo(-p.size / 2, p.size / 2); ctx.closePath(); ctx.fill(); }
          ctx.globalAlpha = 1; ctx.restore();
        }
      }
    }

    // ── Main Initialization ──
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const trail = new TrailRenderer();
    const click = new ClickEffectRenderer();

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener("resize", resize);
    // Keyboard Overlay state
    const kbConfig = {
      enabled: false,
      fontFamily: "JetBrains Mono",
      fontSize: 14,
      opacity: 0.9,
      x: 480,
      y: 800,
      width: 360,
      cornerRadius: 8,
      borderWidth: 1,
      borderColor: "rgba(255, 255, 255, 0.15)",
      backgroundColor: "rgba(0, 0, 0, 0.65)",
      textColor: "#ffffff",
      theme: "classic",
      keyMappings: "{}",
      maxBubbles: 4,
      bubbleTimeoutMs: 3000
    };

    function applyKeyboardStyles() {
      const el = document.getElementById("keyboard-overlay");
      if (!el) return;

      if (!kbConfig.enabled) {
        el.style.display = "none";
        return;
      }

      // Position and geometry
      el.style.display     = "flex";
      el.style.left        = `${kbConfig.x}px`;
      el.style.top         = `${kbConfig.y}px`;
      el.style.width       = `${kbConfig.width}px`;
      el.style.minWidth    = `${kbConfig.width}px`;
      el.style.borderRadius = `${kbConfig.cornerRadius}px`;

      // Border
      if (kbConfig.borderWidth > 0) {
        el.style.borderStyle = "solid";
        el.style.borderWidth = `${kbConfig.borderWidth}px`;
        el.style.borderColor = kbConfig.borderColor;
      } else {
        el.style.borderStyle = "none";
        el.style.borderWidth = "0";
      }

      // Colors
      el.style.backgroundColor = kbConfig.backgroundColor;
      el.style.color           = kbConfig.textColor;

      // Typography — applied to container so all child .kb-bubble elements inherit it
      el.style.fontFamily = `"${kbConfig.fontFamily}", "JetBrains Mono", monospace`;
      el.style.fontSize   = `${kbConfig.fontSize}px`;

      // Opacity — set directly; show/hide via kb-hidden class
      el.style.opacity = String(kbConfig.opacity);

      // Start hidden (no bubbles yet)
      el.classList.add("kb-hidden");
    }

    // \u2500\u2500 Webcam PiP \u2500\u2500
    // Runs once after config is loaded. Starts the camera stream and positions
    // the #webcam-pip element directly inside this fullscreen overlay window.
    async function initWebcam(cfg) {
      if (!cfg.webcam_enabled) return;

      const pip   = document.getElementById("webcam-pip");
      const video = document.getElementById("webcam-video");
      if (!pip || !video) return;

      // Scale position from output-resolution space to this window's CSS space
      // (same formula as keyboard overlay)
      const scaleX = window.innerWidth  / (cfg.resolution_width  || window.innerWidth);
      const scaleY = window.innerHeight / (cfg.resolution_height || window.innerHeight);
      const size   = Math.round(cfg.webcam_size * ((scaleX + scaleY) / 2));
      const posX   = Math.max(0, Math.min(window.innerWidth  - size, Math.round(cfg.webcam_x * scaleX)));
      const posY   = Math.max(0, Math.min(window.innerHeight - size, Math.round(cfg.webcam_y * scaleY)));

      // Shape
      const shapeMap = { "Circle": "50%", "Rounded": "20%", "Squircle": "30%", "Square": "0px" };
      const radius   = shapeMap[cfg.webcam_shape] || "50%";

      // Apply all styles to the container
      pip.style.display      = "block";
      pip.style.left         = `${posX}px`;
      pip.style.top          = `${posY}px`;
      pip.style.width        = `${size}px`;
      pip.style.height       = `${size}px`;
      pip.style.borderRadius = radius;
      pip.style.opacity      = cfg.webcam_opacity ?? 1.0;

      if (cfg.webcam_border_width > 0) {
        pip.style.border    = `${cfg.webcam_border_width}px solid ${cfg.webcam_border_color || "#00e88a"}`;
        pip.style.boxShadow = `0 0 16px ${cfg.webcam_border_color || "#00e88a"}66, 0 4px 20px rgba(0,0,0,0.5)`;
      }

      // CSS filters: brightness offset (-50..+50), contrast multiplier (0.5-2.0), sharpen via blur+contrast trick
      const brightness = 100 + (cfg.webcam_brightness || 0);
      const contrast   = Math.round((cfg.webcam_contrast ?? 1.0) * 100);
      // Sharpen via saturate + slight contrast boost (no kernel in CSS, but saturate helps perceived sharpness)
      const saturate   = Math.round(100 + (cfg.webcam_sharpen || 0) * 50);
      video.style.borderRadius = radius;
      video.style.filter       = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%)`;

      console.log(`[Webcam PiP] pos=(${posX},${posY}) size=${size} radius=${radius} brightness=${brightness}% contrast=${contrast}% saturate=${saturate}%`);

      // Device selection — cfg.webcam_device is either "default" or a nokhwa numeric index
      let videoConstraints;
      try {
        if (!cfg.webcam_device || cfg.webcam_device === "default" || cfg.webcam_device === "") {
          videoConstraints = { width: { ideal: 1280 }, height: { ideal: 720 } };
        } else {
          const allDevices = await navigator.mediaDevices.enumerateDevices();
          const cams       = allDevices.filter(d => d.kind === "videoinput");
          const idx        = parseInt(cfg.webcam_device, 10);
          const target     = !isNaN(idx) && cams[idx] ? cams[idx] : null;
          videoConstraints = target
            ? { deviceId: { exact: target.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
            : { width: { ideal: 1280 }, height: { ideal: 720 } };
          console.log(`[Webcam PiP] device index=${idx} -> ${target ? target.label : "fallback default"}`);
        }

        const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = stream;
        console.log("[Webcam PiP] stream started OK");
      } catch (e) {
        console.error("[Webcam PiP] getUserMedia failed:", e.name, e.message);
        pip.style.background   = "rgba(30,30,50,0.85)";
        pip.style.display      = "flex";
        pip.style.alignItems   = "center";
        pip.style.justifyContent = "center";
        pip.innerHTML = `<span style="color:#bacbbc;font-size:11px;font-family:monospace;text-align:center">CAM<br>${e.name}</span>`;
      }
    }

    // Load config
    async function loadConfig() {
      try {
        const cfg = await window.__TAURI__.core.invoke("get_config");
        trail.style = cfg.trail_style || "glow";
        trail.color = cfg.cursor_trail_color || "#00e88a";
        click.style = cfg.click_effect || "ripple";
        click.color = cfg.cursor_trail_color || "#00e88a";

        // Keyboard overlay configuration
        // The overlay HTML window is fullscreen at monitor logical resolution.
        // Config values (x, y, width) are stored in OUTPUT resolution space.
        // Scale: logical_val = config_val * (window.innerWidth / cfg.resolution_width)
        const scaleX = window.innerWidth  / (cfg.resolution_width  || window.innerWidth);
        const scaleY = window.innerHeight / (cfg.resolution_height || window.innerHeight);

        kbConfig.enabled      = cfg.keyboard_overlay_enabled || false;
        kbConfig.fontFamily   = cfg.keyboard_overlay_font_family || "JetBrains Mono";
        kbConfig.fontSize     = cfg.keyboard_overlay_font_size     !== undefined ? cfg.keyboard_overlay_font_size     : 14;
        kbConfig.opacity      = cfg.keyboard_overlay_opacity        !== undefined ? cfg.keyboard_overlay_opacity        : 0.9;
        kbConfig.cornerRadius = cfg.keyboard_overlay_corner_radius  !== undefined ? cfg.keyboard_overlay_corner_radius  : 8;
        kbConfig.borderWidth  = cfg.keyboard_overlay_border_width   !== undefined ? cfg.keyboard_overlay_border_width   : 1;
        kbConfig.borderColor  = cfg.keyboard_overlay_border_color  || "rgba(255, 255, 255, 0.15)";
        kbConfig.backgroundColor = cfg.keyboard_overlay_background_color || "rgba(0, 0, 0, 0.65)";
        kbConfig.textColor    = cfg.keyboard_overlay_text_color     || "#e5e5e0";
        kbConfig.theme        = cfg.keyboard_overlay_theme          || "speccy-classic";
        kbConfig.keyMappings  = cfg.keyboard_overlay_key_mappings   || "{}";
        kbConfig.maxBubbles   = cfg.keyboard_overlay_max_bubbles    !== undefined ? cfg.keyboard_overlay_max_bubbles    : 4;
        kbConfig.bubbleTimeoutMs = cfg.keyboard_overlay_bubble_timeout_ms !== undefined ? cfg.keyboard_overlay_bubble_timeout_ms : 3000;

        // Scale position and width from output-resolution space to screen logical space
        const rawWidth = cfg.keyboard_overlay_width !== undefined ? cfg.keyboard_overlay_width : 360;
        const rawX     = cfg.keyboard_overlay_x     !== undefined ? cfg.keyboard_overlay_x     : Math.round((cfg.resolution_width - rawWidth) / 2);
        const rawY     = cfg.keyboard_overlay_y     !== undefined ? cfg.keyboard_overlay_y     : Math.round(cfg.resolution_height - 120);

        kbConfig.width = Math.round(rawWidth * scaleX);
        kbConfig.x     = Math.max(0, Math.min(window.innerWidth  - kbConfig.width,  Math.round(rawX * scaleX)));
        kbConfig.y     = Math.max(0, Math.min(window.innerHeight - 80,              Math.round(rawY * scaleY)));

        console.log(`[KB] scale=(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)}) raw=(${rawX}, ${rawY}) → css=(${kbConfig.x}, ${kbConfig.y}) width=${kbConfig.width}`);


        applyKeyboardStyles();

        // ── Webcam PiP init ──
        initWebcam(cfg);

        // Show window once configuration has been successfully loaded and applied
        if (window.__TAURI__ && window.__TAURI__.window) {
          window.__TAURI__.window.getCurrentWindow().show().catch(() => {});
        }
      } catch (e) { 
        console.error("Config load failed:", e);
        // Fallback show if config load fails
        if (window.__TAURI__ && window.__TAURI__.window) {
          window.__TAURI__.window.getCurrentWindow().show().catch(() => {});
        }
      }
    }
    loadConfig();

    // Persistent bubble list & Incremental event processing state
    let persistentBubbles = [];
    let activeTextBubble = null;
    let lastEventTime = 0;
    let recordingStartSystemTime = null;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function processEventsIncremental(newEvents) {
      let mappings = {};
      try {
        mappings = JSON.parse(kbConfig.keyMappings);
      } catch (e) {}

      const normalizeKey = (key) => {
        if (key === "LCtrl" || key === "RCtrl") return "Ctrl";
        if (key === "LShift" || key === "RShift") return "Shift";
        if (key === "LAlt" || key === "RAlt") return "Alt";
        return key;
      };

      const getMapping = (key) => {
        const norm = normalizeKey(key);
        return mappings[norm] || mappings[key] || norm;
      };

      const appendCharacter = (char, t) => {
        const PUNCTUATION = [";", ":", ",", ".", "?", "!"];
        if (PUNCTUATION.includes(char)) {
          const lastBubble = persistentBubbles[persistentBubbles.length - 1];
          if (lastBubble && lastBubble.type === "text") {
            lastBubble.text += char;
            lastBubble.lastUpdatedTime = t;
            activeTextBubble = lastBubble;
            return;
          }
        }

        if (activeTextBubble) {
          activeTextBubble.text += char;
          activeTextBubble.lastUpdatedTime = t;
        } else {
          activeTextBubble = {
            type: "text",
            text: char,
            lastUpdatedTime: t,
          };
          persistentBubbles.push(activeTextBubble);
        }
      };

      const getShiftedKey = (k) => {
        if (/^[a-zA-Z]$/.test(k)) {
          return k.toUpperCase();
        }
        const SHIFT_MAP = {
          "1": "!", "2": "@", "3": "#", "4": "$", "5": "%", "6": "^", "7": "&", "8": "*", "9": "(", "0": ")",
          "-": "_", "=": "+", "[": "{", "]": "}", "\\": "|", ";": ":", "'": "\"", ",": "<", ".": ">", "/": "?",
          "`": "~"
        };
        return SHIFT_MAP[k] || null;
      };

      for (let i = 0; i < newEvents.length; i++) {
        const event = newEvents[i];
        let key = event.key;
        const t = event.timestamp_ms;
        const ctrl = event.ctrl || false;
        const shift = event.shift || false;
        const alt = event.alt || false;
        const win = event.win || false;

        // Idle pause timeout check (1.2s between consecutive keys)
        if (activeTextBubble && lastEventTime > 0 && t - lastEventTime > 1200) {
          activeTextBubble = null;
        }
        lastEventTime = t;

        const norm = normalizeKey(key);

        // Space delimiter split
        if (norm === "Space") {
          activeTextBubble = null;
          if (key === "*") {
            appendCharacter("*", t);
          } else {
            appendCharacter(" ", t);
          }
          continue;
        }

        // Arrow keys — MUST seal active text and be shown as their own box (as requested)
        const isArrow = ["←", "↑", "→", "↓", "ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown"].includes(norm);
        if (isArrow) {
          activeTextBubble = null;
          let text = getMapping(norm);
          // If there are modifiers (e.g. Ctrl + Arrow)
          if (ctrl || alt || win || shift) {
            const parts = [];
            if (ctrl) parts.push("Ctrl");
            if (alt) parts.push("Alt");
            if (win) parts.push("Win");
            if (shift) parts.push("Shift");
            parts.push(text);
            text = parts.join(" + ");
            persistentBubbles.push({
              type: "shortcut",
              text: text,
              lastUpdatedTime: t,
            });
          } else {
            persistentBubbles.push({
              type: "special",
              text: text,
              lastUpdatedTime: t,
            });
          }
          continue;
        }

        // Check if it's a shortcut combo:
        // ctrl, alt, or win are active, OR (shift is active AND key is a special/non-printable key)
        const isSpecialKey = ["Enter", "Tab", "Esc", "NumEnter", "Backspace", "Delete", "Insert", "PageUp", "PageDown", "Home", "End", "CapsLock", "ScrollLock", "NumLock", "Pause", "PrintScreen"].includes(norm) || (norm.startsWith("F") && norm.length > 1);
        
        const isShortcut = ctrl || alt || win || (shift && isSpecialKey);

        if (isShortcut) {
          const parts = [];
          if (ctrl) parts.push("Ctrl");
          if (alt) parts.push("Alt");
          if (win) parts.push("Win");
          
          if (shift && norm !== "Shift") {
            parts.push("Shift");
          }

          if (norm !== "Ctrl" && norm !== "Alt" && norm !== "Win" && norm !== "Shift") {
            parts.push(getMapping(key));
          }

          if (parts.length > 0) {
            activeTextBubble = null;
            persistentBubbles.push({
              type: "shortcut",
              text: parts.join(" + "),
              lastUpdatedTime: t,
            });
          }
          continue;
        }

        // Backspace logic (modifies text in place, never shows backspace bubble)
        if (norm === "Backspace") {
          if (activeTextBubble && activeTextBubble.text.length > 0) {
            activeTextBubble.text = activeTextBubble.text.slice(0, -1);
            activeTextBubble.lastUpdatedTime = t;
            if (activeTextBubble.text.length === 0) {
              const idx = persistentBubbles.indexOf(activeTextBubble);
              if (idx > -1) {
                persistentBubbles.splice(idx, 1);
              }
              activeTextBubble = null;
            }
          }
          continue;
        }

        // Delimiter keys
        const isDelim = ["Enter", "Tab", "Esc", "NumEnter"].includes(norm);
        if (isDelim) {
          activeTextBubble = null;
          persistentBubbles.push({
            type: "special",
            text: getMapping(key),
            lastUpdatedTime: t,
          });
          continue;
        }

        // Handle Shift + printable keys (e.g. Shift + 1 -> !, Shift + a -> A)
        if (shift && norm !== "Shift") {
          const shifted = getShiftedKey(key);
          if (shifted !== null) {
            appendCharacter(shifted, t);
            continue;
          }
        }

        // Normal characters / symbols (excluding modifier keys themselves)
        if (norm !== "Ctrl" && norm !== "Alt" && norm !== "Win" && norm !== "Shift") {
          if (key.length === 1) {
            const char = /^[A-Z]$/.test(key) ? key.toLowerCase() : key;
            appendCharacter(char, t);
          } else {
            activeTextBubble = null;
            persistentBubbles.push({
              type: "special",
              text: getMapping(key),
              lastUpdatedTime: t,
            });
          }
        }
      }
    }

    // Track last rendered state to avoid unnecessary DOM mutations
    let lastRenderedHtml = "";
    let lastBubbleCount = -1;

    function updateKeyboardOverlay() {
      const el = document.getElementById("keyboard-overlay");
      if (!el || !kbConfig.enabled) return;

      // Calculate elapsed time since recording start
      const elapsed = recordingStartSystemTime ? (Date.now() - recordingStartSystemTime) : 0;

      // Seal active text bubble if user has been idle for >1.2s
      if (activeTextBubble && lastEventTime > 0 && elapsed - lastEventTime > 1200) {
        activeTextBubble = null;
      }

      // Prune timed-out bubbles (keep the active one alive regardless)
      persistentBubbles = persistentBubbles.filter(b => {
        if (b === activeTextBubble) return true;
        return (elapsed - b.lastUpdatedTime) < kbConfig.bubbleTimeoutMs;
      });

      // Clamp to max bubble count from config
      while (persistentBubbles.length > kbConfig.maxBubbles) {
        persistentBubbles.shift();
      }

      // Show/hide overlay container based on whether there are active bubbles
      if (persistentBubbles.length === 0) {
        if (!el.classList.contains("kb-hidden")) {
          el.classList.add("kb-hidden");
          lastRenderedHtml = "";
        }
        return;
      }

      // Reveal overlay when there are bubbles to show
      el.classList.remove("kb-hidden");

      // Diff-based DOM update: only touch the DOM when content changes
      const newHtml = persistentBubbles.map(b =>
        `<div class="kb-bubble">${escapeHtml(b.text)}</div>`
      ).join("");

      if (newHtml !== lastRenderedHtml) {
        el.innerHTML = newHtml;
        lastRenderedHtml = newHtml;
      }
    }

    // ── Listen to Tauri events from Rust mouse tracking thread ──
    // This is the KEY FIX: we receive cursor data via IPC events, not DOM events
    // (DOM events don't fire on click-through transparent windows)
    async function setupEventListeners() {
      try {
        const { listen } = window.__TAURI__.event;

        // Cursor movement — arrives at ~120Hz from Rust
        await listen("cursor-move", (event) => {
          const [x, y] = event.payload;
          trail.addRawPoint(x / window.devicePixelRatio, y / window.devicePixelRatio);
        });

        // Click events — arrives on mouse button press
        await listen("cursor-click", (event) => {
          const [x, y, _button] = event.payload;
          click.addClick(x / window.devicePixelRatio, y / window.devicePixelRatio);
        });

        // Keyboard events — arrives on key press from Rust to prevent background throttling
        await listen("keyboard-event", (event) => {
          const keyEvent = event.payload;
          if (!recordingStartSystemTime) {
            recordingStartSystemTime = Date.now() - keyEvent.timestamp_ms;
          }
          processEventsIncremental([keyEvent]);
          updateKeyboardOverlay();
        });

        console.log("[EasySpecy] Event listeners registered — receiving cursor data from Rust");
      } catch (e) {
        console.error("[EasySpecy] Failed to set up event listeners:", e);
        // Fallback: try DOM events (won't work on click-through but useful for debugging)
        document.addEventListener("mousemove", e => trail.addRawPoint(e.clientX, e.clientY));
        document.addEventListener("mousedown", e => click.addClick(e.clientX, e.clientY));
      }
    }
    setupEventListeners();

    // ── Render Loop (runs at display refresh rate, independent of input rate) ──
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      trail.update(); trail.draw(ctx);
      click.update(); click.draw(ctx);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
